[project]
name = "justenough-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29", "pydantic>=2.8", "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9", "argon2-cffi>=23.1", "httpx>=0.27",
  "redis>=5", "celery>=5.4", "python-multipart>=0.0.9"
]
[project.optional-dependencies]
test=["pytest>=8","pytest-asyncio>=0.23","pytest-cov>=5","respx>=0.21"]
[tool.pytest.ini_options]
asyncio_mode="auto"
pythonpath=["."]
