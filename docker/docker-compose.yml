version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: justenough_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: justenough
    ports:
      - "5432:5432"
    volumes:
      - justenough_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d justenough"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    container_name: justenough_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/justenough
      SECRET_KEY: supersecretkey_production_grade_v6_1
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: "*"
      APP_NAME: "JustEnough Functional MVP API"
      DEBUG: "false"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  justenough_pgdata:
