version: '3.8'

services:
  test_postgres:
    image: postgres:17-alpine
    container_name: justenough_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: justenough_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d justenough_test"]
      interval: 3s
      timeout: 3s
      retries: 5

  test_runner:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    container_name: justenough_test_runner
    environment:
      DATABASE_URL: postgresql://postgres:postgres@test_postgres:5432/justenough_test
      SECRET_KEY: testsecretkey
    depends_on:
      test_postgres:
        condition: service_healthy
    command: ["pytest", "Backend/tests", "ML/tests", "-v", "--cov=Backend/app"]
