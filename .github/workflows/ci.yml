name: JustEnough MVP CI (Web-Centric)

on:
  push:
    branches: [ 'mvp/justenough-functional-mvp' ]
  pull_request:
    branches: [ 'mvp/justenough-functional-mvp' ]

jobs:
  backend-tests:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./Backend[test]"
          pip install pytest-cov

      - name: Run Backend Pytest Suite with Coverage
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_with_at_least_32_characters!
          DATABASE_URL: sqlite:///:memory:
        run: |
          python -m pytest Backend/tests -v --cov=Backend/app --cov-report=term-missing

  ml-baseline-tests:
    name: ML Model & Forecast Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scikit-learn lightgbm joblib

      - name: Run ML Baseline Tests
        run: |
          python -m pytest ML/tests -v

  web-mvp-tests:
    name: Canonical Vanilla Web MVP (HTML5 + CSS3 + JS ES Modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Vanilla Web HTML, CSS and JS Structure
        run: |
          echo "Verifying canonical Vanilla Web entrypoints..."
          test -f Web/index.html
          test -f Web/login.html
          test -f Web/morning-brief.html
          test -f Web/css/bundle.css
          test -f Web/js/api.js
          test -f Web/js/auth.js

      - name: Syntax Check JavaScript ES Modules
        run: |
          for f in Web/js/*.js Web/js/pages/*.js; do
            node --check "$f"
          done
          echo "All Vanilla JavaScript modules passed syntax validation!"

      - name: Static Server Smoke Test
        run: |
          npx serve Web -l 3000 &
          sleep 3
          curl -f http://localhost:3000/login.html || exit 1
          curl -f http://localhost:3000/morning-brief.html || exit 1
          curl -f http://localhost:3000/css/bundle.css || exit 1
          echo "Static Vanilla Web Server verified over HTTP!"

  security-and-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for Hardcoded Secrets
        run: |
          echo "Scanning for exposed tokens or keys..."
          ! grep -rn "sk_live_\|ghp_\|AIzaSy" Backend/ Web/ || exit 1

  legacy-flutter-tests:
    name: Legacy Flutter Reference (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: Frontend
        run: flutter pub get

      - name: Flutter Static Analysis
        working-directory: Frontend
        run: flutter analyze || true

      - name: Flutter Test Suite
        working-directory: Frontend
        run: flutter test || true
