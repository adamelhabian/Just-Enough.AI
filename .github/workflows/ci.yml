name: JustEnough MVP CI (Web-Centric)

on:
  push:
    branches: [ 'mvp/justenough-functional-mvp' ]
  pull_request:
    branches: [ 'mvp/justenough-functional-mvp' ]

jobs:
  backend-tests:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./Backend[test]"
          pip install pytest-cov

      - name: Run Backend Pytest Suite with Coverage
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_with_at_least_32_characters!
          DATABASE_URL: sqlite:///:memory:
        run: |
          python -m pytest Backend/tests -v --cov=Backend/app --cov-report=term-missing

  ml-baseline-tests:
    name: ML Model & Forecast Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scikit-learn lightgbm joblib

      - name: Run ML Baseline Tests
        run: |
          python -m pytest ML/tests -v

  web-mvp-tests:
    name: Canonical Web MVP (React 18 + TS + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Static Analysis
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Suite (Contract & Operational Loops)
        run: npm test

      - name: Production Build Verification
        run: npm run build

  security-and-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for Hardcoded Secrets
        run: |
          echo "Scanning for exposed tokens or keys..."
          ! grep -rn "sk_live_\|ghp_\|AIzaSy" Backend/ Web/src/ || exit 1

      - name: Web Dependency Security Audit
        working-directory: Web
        run: npm audit --audit-level=high || true

  legacy-flutter-tests:
    name: Legacy Flutter Reference (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: Frontend
        run: flutter pub get

      - name: Flutter Static Analysis
        working-directory: Frontend
        run: flutter analyze || true

      - name: Flutter Test Suite
        working-directory: Frontend
        run: flutter test || true
